
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Food Inventory</title>

    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="login-container">

        <section class="login-brand">
            <div class="brand-logo">🥬</div>

            <h1>Food Inventory</h1>

            <p>
                Manage your food supplies,
                monitor your stocks, and keep
                everything organized.
            </p>

            <div class="brand-footer">
                Food Inventory Management System
            </div>
        </section>

        <section class="login-form-section">

            <div class="login-card">

                <div class="welcome-text">
                    <span class="welcome-label">WELCOME BACK</span>

                    <h2>Sign in to your account</h2>

                    <p>Enter your credentials to continue.</p>
                </div>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="username">Username</label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <p id="loginMessage" role="status" aria-live="polite"></p>
                    <button type="submit" class="login-button">
                        Sign In
                    </button>

                </form>

                <div class="login-footer">
                    <p>Authorized Admin and Staff Only</p>
                </div>

            </div>

        </section>

    </main>

    <script src="apiCLient.js"></script>
    <script>
        const api = new APIClient("http://localhost:3000");
        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            loginMessage.textContent = "Signing in…";

            try {
                const result = await api.post("/api/login", {
                    username: document.getElementById("username").value.trim(),
                    password: document.getElementById("password").value
                });
                api.setToken(result.token);
                window.location.href = "index.html";
            } catch (error) {
                loginMessage.textContent = error.message;
            }
        });
    </script>
</body>
</html>
